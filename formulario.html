<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    

    

</head>

<body>

    <!--cabecalho do nosso site-->
    <header>
        <H1>Sistema de Gestão de Clientes</H1>
        <p>Modulo de cadastro de Pessoas</p>
    </header>

    <!--Conteúdo principal do nosso site-->
    <main>
        <h2>Cadastro de Clientes</h2>
        <!--Iniciando o nosso lindo formulário-->
        <form action="#" method="post" enctype="multipart/form-data">
            <div class="upload-foto">
                <label for="foto"> <strong> Foto do Cliente</strong> </label>

                <input type="file" id="foto" name="foto" accept="image/*">

            </div>

            <!--Obter o nome do usuário-->
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
            </div>

            <!--Div dos dados pessoais-->
            <div class ="linha">
                <div class="campo">
                    <label for="nascimento">Data de Nascimento </label>
                    <input type="date" id="nascimento" required>

                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <select id="genero" name=" genero">
                        <option value="Selecione uma das opções"></option>
                        <option value="Feminino">feminino</option>
                        <option value="masculino">masculino</option>
                        <option value="outros">outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cpf">CPF></label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlenght="14" required>
                </div>

                <!--DIV dos contatos-->
                <!--Segunda linha-->
                <div class="linha">
                      
                     <!--agora colocarei os contatos nesta linha-->
                     <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="telefone" placeholder="(00)00000-0000" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="mail@dominio.com.br" required>

                </div>
            </div>

            <div class="campo">
                <label for="endereco"></label>
                <label type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro...."required>

                <!--Terceira linha - Dados de endereço-->

                <div class="linha">
                    <div class="class">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade placeholder="Digite a sua cidade" required></div>


                <div>
                <!--observações--> 
                
                <div class="campo">
                     <label for="observacoes">Observaçoes</label>
                     <textarea id="observacoes" name="observaçoes"rows="4" placeholder="informaçoes adicionais sobre o cliente"></textarea>
                     
                </div>


                <!--botão para enviar os dados-->

                <input types="submit" value="Salvar"
                class="btn-enviar">
                
                <a href="index.html" class="btn-enviar">Voltar à página principal</a></form>>

            

            
            


    </main>


</body>

</html>
